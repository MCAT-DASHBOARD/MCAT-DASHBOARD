name: Publish Brain Data

# ─────────────────────────────────────────────────────────────────────────────
# IMPORTANT — READ BEFORE DEPLOYING
#
# The `workflows:` value below must exactly match the `name:` field at the top
# of your mcat-refresh.yml file (not the filename — the display name).
# See DEPLOY_BRAIN_ENDPOINT.md Step 0 for instructions on how to find it.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_run:
    workflows: ["MCAT Data Refresh"]   # <── verify this matches mcat-refresh.yml `name:`
    types:
      - completed
  workflow_dispatch:                   # allows manual trigger from Actions tab

permissions:
  contents: write                      # required to commit brain_data.json back to repo
  issues: write                        # Fix I: required to open alert issues

jobs:
  publish-brain-data:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # For automatic runs: only proceed if the pipeline workflow actually succeeded.
    # For manual runs (workflow_dispatch): always proceed regardless.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:

      # ── 1. Check out the repository ────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        # GITHUB_TOKEN is automatically provided; contents:write permission above
        # allows the later git push to succeed without additional authentication.

      # ── 2. Fetch mcat_live_data from Cloudflare KV ─────────────────────────
      - name: Fetch mcat_live_data from Cloudflare KV
        run: |
          echo "Fetching mcat_live_data from Cloudflare KV..."

          HTTP_CODE=$(curl -s \
            -o kv_raw.json \
            -w "%{http_code}" \
            "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CF_ACCOUNT_ID }}/storage/kv/namespaces/${{ secrets.CF_KV_NAMESPACE }}/values/mcat_live_data" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}")

          echo "HTTP response code: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ KV fetch failed (HTTP $HTTP_CODE). Printing response body and aborting."
            echo "--- Response body ---"
            cat kv_raw.json
            echo "--- End response body ---"
            echo ""
            echo "The existing brain_data.json in the repo has NOT been overwritten."
            echo "Stale-but-readable is better than empty. Investigate the Cloudflare API."
            exit 1
          fi

          echo "✅ KV fetch succeeded (HTTP 200)"

          # Validate that the response body is well-formed JSON before proceeding.
          # If the pipeline wrote a corrupted payload, we fail here rather than
          # publishing garbage to the endpoint.
          python3 -c "
          import json, sys
          try:
              data = json.load(open('kv_raw.json'))
              print('✅ JSON validation passed')
          except Exception as e:
              print(f'❌ JSON validation failed: {e}')
              sys.exit(1)
          "

      # ── 3. Inject published_at timestamp and write brain_data.json ──────────
      - name: Inject published_at and write brain_data.json
        run: |
          python3 - <<'PYEOF'
          import json
          from datetime import datetime, timezone

          with open('kv_raw.json', 'r') as f:
              data = json.load(f)

          # Add a single new top-level field so Brain can verify freshness.
          # This is the only transformation applied — everything else is passed through as-is.
          data['published_at'] = datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')

          with open('brain_data.json', 'w') as f:
              # indent=2 for readability; default=str catches any non-serializable edge cases
              json.dump(data, f, indent=2, default=str)

          print(f"✅ brain_data.json written — published_at: {data['published_at']}")
          PYEOF

      # ── 4. Commit and push only if the file actually changed ────────────────
      - name: Commit and push brain_data.json if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add brain_data.json

          if git diff --cached --quiet; then
            echo "ℹ️  brain_data.json is identical to the last committed version — nothing to commit."
            echo "    This is normal if the pipeline has not produced new data since the last run."
          else
            git commit -m "chore: refresh brain_data.json [skip ci]"
            git push
            echo "✅ brain_data.json committed and pushed. GitHub Pages will serve the updated file within ~1 minute."
          fi

      # ── 5. MCAT alerting — open a GitHub Issue on signal events (Fix I) ────
      # GitHub natively emails the repo owner on new issues = free alerting.
      # continue-on-error: a failed alert must never block publishing.
      - name: Create alert issue on signal events
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PYEOF'
          import json, os, urllib.request
          from datetime import datetime, timezone

          today = datetime.now(timezone.utc).strftime('%Y-%m-%d')
          data = json.load(open('brain_data.json'))
          states = data.get('asset_states', {}) or {}

          lines = []
          for sym, s in states.items():
              for ev in (s.get('event_log') or []):
                  if ev.get('date') == today:
                      lines.append(f"- **{sym} {ev.get('type')}** — `{json.dumps(ev)}`")
              cd = s.get('cluster_days') or 0
              if cd >= 1:
                  lines.append(f"- **{sym} PRE-SIGNAL: cluster_days={cd}** (both percentiles <12 — canonical signal fires at 2)")

          if not lines:
              print('No alert conditions today — skipping issue.')
              raise SystemExit(0)

          title = f"MCAT Alert — {today}"
          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']

          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/issues?state=open&per_page=50",
              headers={'Authorization': f'Bearer {token}', 'Accept': 'application/vnd.github+json'})
          existing = json.load(urllib.request.urlopen(req))
          if any(i.get('title') == title for i in existing):
              print('Alert issue for today already exists — skipping.')
              raise SystemExit(0)

          body = ("Automated MCAT alert (Fix I).\n\n" + "\n".join(lines) +
                  "\n\nDashboard: https://mcat-dashboard.github.io/MCAT-DASHBOARD/\n"
                  f"Data: published_at {data.get('published_at')}")
          payload = json.dumps({'title': title, 'body': body}).encode()
          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/issues", data=payload, method='POST',
              headers={'Authorization': f'Bearer {token}', 'Accept': 'application/vnd.github+json',
                       'Content-Type': 'application/json'})
          resp = json.load(urllib.request.urlopen(req))
          print(f"✅ Alert issue created: {resp.get('html_url')}")
          PYEOF
